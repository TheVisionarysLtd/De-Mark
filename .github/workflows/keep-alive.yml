name: keep-alive

# Keeps the free-tier Streamlit app awake so visitors never hit the "this app is
# asleep" screen. A real browser page-load is required: the app 303-redirects
# through a Streamlit auth handshake that a plain curl can't follow, and the
# sleep timer watches for real sessions — so this loads the app in headless
# Chromium every ~10 minutes and clicks the "wake" button if it has gone to sleep.
#
# Free: runs on GitHub's servers (unlimited minutes for public repos).
# NOTE: GitHub disables scheduled workflows after 60 days with no repo commits —
# any push (this project is active) resets that. You can also run it on demand
# from the Actions tab → "keep-alive" → "Run workflow".

on:
  schedule:
    - cron: "*/10 * * * *"    # every 10 minutes (GitHub may delay under load)
  workflow_dispatch: {}         # manual "Run workflow" button

permissions:
  contents: read

concurrency:                    # never overlap two pings
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Load De:Mark (and wake it if asleep)
        env:
          APP_URL: https://de-mark.streamlit.app/
        run: |
          python - <<'PY'
          import os, re
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  page = browser.new_page()
                  # A real load follows the auth redirects and opens a session.
                  page.goto(url, wait_until="load", timeout=90000)

                  # If the app is asleep, Streamlit shows a wake button — click it.
                  try:
                      btn = page.get_by_role(
                          "button", name=re.compile("get this app back up", re.I))
                      if btn.count() > 0:
                          print("App was asleep - clicking the wake button.")
                          btn.first.click()
                          page.wait_for_timeout(45000)   # let the container boot
                  except Exception as e:
                      print("wake-check note:", e)

                  page.wait_for_timeout(8000)            # let the session settle
                  print("OK - page title:", page.title())
                  browser.close()
          except Exception as e:
              # A transient hiccup should not fail the run (keeps the schedule green).
              print("keep-alive transient error:", e)
          PY
